<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticias — Federación de Golf de Castilla-La Mancha</title>
  <link rel="icon" type="image/png" href="img/favicon_pagina.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shared.css">
  <style>
    body { padding-top: 70px; }

    /* ── Autocomplete & Buscador ── */
    .buscador-container { position: relative; flex: 1; min-width: 220px; display: flex; align-items: center; }
    .buscador-container input { width: 100%; padding-left: 36px !important; min-width: 0 !important; }
    .buscador-icon { position: absolute; left: 12px; color: var(--gray-300); pointer-events: none; transition: color 0.2s; }
    .buscador-container input:focus ~ .buscador-icon { color: var(--green-accent); }
    
    .autocomplete-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--white); border: 1.5px solid var(--gray-100);
      border-radius: 5px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      z-index: 100; max-height: 320px; overflow-y: auto; display: none;
      flex-direction: column;
    }
    .autocomplete-item {
      padding: 12px 16px; font-size: 13px; color: var(--gray-600);
      text-decoration: none; display: block; border-bottom: 1px solid var(--gray-50);
      transition: background 0.2s; line-height: 1.4;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: var(--gray-50); color: var(--green-dark); }
    .autocomplete-item strong { color: var(--green-dark); font-weight: 900; }

    /* ── Filtros ── */
    .filtros-section {
      background: var(--gray-50);
      padding: 24px 6rem;
      border-bottom: 1px solid var(--gray-100);
      position: sticky; top: 70px; z-index: 50;
    }
    .filtros-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .filtros-row input,
    .filtros-row select {
      padding: 10px 16px;
      border: 1.5px solid var(--gray-100);
      border-radius: 3px;
      font-family: var(--font-body);
      font-size: 13px; outline:none;
      color: var(--gray-900); background: var(--white);
      transition: border-color 0.2s;
    }
    .filtros-row input { min-width:220px; flex:1; }
    .filtros-row input:focus,
    .filtros-row select:focus { border-color: var(--green-accent); }
    .filtro-anyos { }
    .filtro-anyo-btn-UNUSED {
      padding: 8px 14px;
      font-size:11px; font-weight:700;
      text-transform:uppercase; letter-spacing:0.8px;
      font-family: var(--font-body);
      border: 1.5px solid var(--gray-100);
      border-radius: 3px;
      background: var(--white); color: var(--gray-600);
      cursor: pointer; transition: all 0.2s;
    }
    /* year select styled via .filtros-row select above */

    /* ── Layout principal ── */
    .noticias-main-grid {
      display: grid;
      grid-template-columns: 1fr 252px;
      align-items: start;
      padding: 0 4rem;
      gap: 0;
    }
    .listado-section { background: var(--white); padding: 40px 40px 80px 0; }

    /* ── Sidebar patrocinadores ── */
    .patroc-sidebar {
      padding: 40px 0 40px 32px;
      position: sticky; top: 140px;
      border-left: 1px solid var(--gray-100);
    }
    .patroc-sidebar-inner {
      background: var(--gray-50);
      border: 1px solid var(--gray-100);
      border-radius: 8px; overflow: hidden;
    }
    .patroc-sidebar-title {
      background: var(--green-dark); padding: 13px 18px;
      font-size: 10px; font-weight: 700;
      color: var(--gold); text-transform: uppercase; letter-spacing: 1.5px;
    }
    .patroc-sidebar-body { padding: 20px 16px; }
    .patroc-main {
      display: flex; flex-direction: column; align-items: center;
      padding: 16px 12px 18px;
      background: var(--white); border: 1px solid var(--gray-100);
      border-radius: 6px; text-decoration: none; transition: box-shadow 0.2s;
      margin-bottom: 14px;
    }
    .patroc-main:hover { box-shadow: 0 4px 14px rgba(10,61,46,0.08); }
    .patroc-main-badge { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--green-accent); margin-bottom: 10px; }
    .patroc-main img { max-width: 140px; max-height: 50px; width: auto; height: auto; object-fit: contain; }
    .patroc-main-name { font-size: 10px; color: var(--gray-300); margin-top: 8px; text-align: center; }
    .patroc-colab-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .patroc-colab-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; background: var(--white);
      border: 1px solid var(--gray-100); border-radius: 5px;
      text-decoration: none; transition: border-color 0.2s;
    }
    .patroc-colab-item:hover { border-color: var(--green-accent); }
    .patroc-colab-item img { max-width: 64px; max-height: 30px; width: auto; height: auto; object-fit: contain; flex-shrink: 0; }
    .patroc-colab-name { font-size: 10px; color: var(--gray-600); font-weight: 500; line-height: 1.3; }
    .patroc-colab-badge { font-size: 7px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--green-accent); display: block; margin-bottom: 2px; }
    .patroc-divider { border: none; border-top: 1px solid var(--gray-100); margin: 12px 0; }
    .patroc-divider-label { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gray-300); margin-bottom: 10px; }
    .patroc-logos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .patroc-logo-item {
      display: flex; align-items: center; justify-content: center;
      padding: 10px 8px; background: var(--white);
      border: 1px solid var(--gray-100); border-radius: 5px;
      min-height: 52px; text-decoration: none; transition: border-color 0.2s;
    }
    .patroc-logo-item:hover { border-color: var(--green-accent); }
    .patroc-logo-item img { max-width: 80px; max-height: 36px; width: auto; height: auto; object-fit: contain; }

    /* ── Loading skeleton ── */
    .loading-state { display:flex; flex-direction:column; gap:2px; }
    .skeleton-card {
      display:grid; grid-template-columns:220px 1fr;
      background:var(--white); border:1.5px solid var(--gray-100);
      height:130px; overflow:hidden;
      animation: shimmer 1.4s ease-in-out infinite;
    }
    .skeleton-img { background:var(--gray-100); }
    .skeleton-body { padding:20px; display:flex; flex-direction:column; gap:10px; }
    .skeleton-line { background:var(--gray-100); border-radius:2px; }
    @keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:0.5} }

    /* ── Grid noticias ── */
    #noticiasGrid { display:flex; flex-direction:column; gap:2px; }

    .noticia-fila {
      display:grid; grid-template-columns: 220px 1fr;
      background: var(--white);
      text-decoration: none; color: inherit;
      border: 1.5px solid var(--gray-100);
      overflow: hidden; transition: all 0.22s;
    }
    .noticia-fila:hover { border-color: var(--gold); box-shadow: 0 4px 16px rgba(10,61,46,0.07); }

    .noticia-fila-thumb {
      width:220px; min-height:148px;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; overflow:hidden; position:relative;
    }
    .noticia-fila-thumb img {
      width:100%; height:100%; object-fit:cover;
      position:absolute; inset:0; transition: transform 0.4s;
    }
    .noticia-fila:hover .noticia-fila-thumb img { transform:scale(1.05); }
    .noticia-fila-thumb .emoji-fallback { font-size:36px; position:relative; z-index:1; }
   .noticia-fila-thumb .img-fallback { object-fit: contain; }

    .noticia-fila-body { padding: 18px 22px 20px; display:flex; flex-direction:column; gap:7px; }
    .noticia-fila-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .noticia-cat {
      display:inline-block; padding:3px 10px;
      background:var(--green-light); color:var(--green-mid);
      font-size:10px; font-weight:700;
      text-transform:uppercase; letter-spacing:1px; border-radius:2px;
    }
    .noticia-fecha { font-size:11px; color:var(--gray-300); }
    .noticia-fila-titulo {
      font-family: var(--font-display);
      font-size:15.5px; font-weight:700; line-height:1.3;
      color:var(--green-dark); transition:color 0.2s;
    }
    .noticia-fila:hover .noticia-fila-titulo { color:var(--green-accent); }
    .noticia-fila-excerpt { font-size:13px; color:var(--gray-600); line-height:1.65; }
    .noticia-fila-link {
      font-size:11px; font-weight:700; color:var(--green-accent);
      text-transform:uppercase; letter-spacing:1px;
      margin-top:auto; padding-top:4px;
    }

    /* ── Paginación ── */
    .listado-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; flex-wrap:wrap; gap:10px; }
    .result-count { font-size:12px; color:var(--gray-300); }
    .paginacion { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:40px; flex-wrap:wrap; }
    .pag-btn {
      padding:8px 14px; min-width:36px;
      font-family:var(--font-body); font-size:13px; font-weight:600;
      border:1.5px solid var(--gray-100); border-radius:3px;
      background:var(--white); color:var(--gray-600);
      cursor:pointer; transition:all 0.2s;
    }
    .pag-btn:hover { border-color:var(--green-dark); color:var(--green-dark); }
    .pag-btn.active { background:var(--green-dark); color:var(--white); border-color:var(--green-dark); }
    .pag-btn:disabled { opacity:0.35; cursor:default; pointer-events:none; }
    .empty-state { padding:60px; text-align:center; color:var(--gray-300); font-size:14px; }
    .empty-state strong { display:block; font-size:18px; margin-bottom:8px; }

    /* ── Responsive ── */
    @media (max-width:1100px) { .noticias-main-grid { padding: 0 2.5rem; } .filtros-section { padding:20px 2.5rem; } }
    @media (max-width:900px) {
      .filtros-section { position:static; }
      .noticias-main-grid { grid-template-columns: 1fr; padding: 0; }
      .listado-section { padding:32px 2.5rem 60px; }
      .patroc-sidebar { position:static; padding: 0 2.5rem 40px; border-left: none; border-top: 1px solid var(--gray-100); }
      .noticia-fila { grid-template-columns:140px 1fr; }
      .noticia-fila-thumb { width:140px; min-height:110px; }
    }
    @media (max-width:600px) {
      .noticia-fila { grid-template-columns:1fr; }
      .noticia-fila-thumb { width:100%; height:180px; min-height:180px; }
    }
  </style>
</head>
<body>

<div class="page-hero">
  <div class="page-hero-content">
    <div class="page-hero-label">Actualidad FGCLM</div>
    <h1>Archivo de <em>Noticias</em></h1>
    <p>5.500+ noticias del golf en Castilla-La Mancha desde 2007 hasta hoy.</p>
  </div>
</div>

<div class="filtros-section">
  <div class="filtros-row">
    <div class="buscador-container">
      <svg class="buscador-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="buscador" placeholder="Buscar noticias..." autocomplete="off">
      <div id="autocompleteResultados" class="autocomplete-dropdown"></div>
    </div>
    <select id="filtroCat">
      <option value="">Todas las categorías</option>
      <option value="Masculino">Masculino</option>
      <option value="Femenino">Femenino</option>
      <option value="Masculino y Femenino">Masculino y Femenino</option>
      <option value="Senior">Senior</option>
      <option value="Juvenil">Juvenil</option>
      <option value="Profesional">Profesional</option>
      <option value="Pitch &amp; Putt">Pitch &amp; Putt</option>
      <option value="Federativas">Federativas</option>
      <option value="Golf Adaptado">Golf Adaptado</option>
      <option value="Reglas y Campos">Reglas y Campos</option>
    </select>
    <select id="filtroAnyos" style="min-width:120px;"></select>
  </div>
</div>

<div class="noticias-main-grid">

<div class="listado-section">
  <div class="listado-header">
    <div class="result-count" id="resultCount">Cargando noticias…</div>
  </div>
  <div class="loading-state" id="loadingState">
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line" style="height:11px;width:28%"></div><div class="skeleton-line" style="height:16px;width:82%"></div><div class="skeleton-line" style="height:11px;width:68%"></div><div class="skeleton-line" style="height:11px;width:55%"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line" style="height:11px;width:22%"></div><div class="skeleton-line" style="height:16px;width:76%"></div><div class="skeleton-line" style="height:11px;width:60%"></div><div class="skeleton-line" style="height:11px;width:48%"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line" style="height:11px;width:32%"></div><div class="skeleton-line" style="height:16px;width:88%"></div><div class="skeleton-line" style="height:11px;width:72%"></div><div class="skeleton-line" style="height:11px;width:50%"></div></div></div>
  </div>
  <div id="noticiasGrid"></div>
  <div class="paginacion" id="paginacion"></div>
</div>

<aside class="patroc-sidebar">
  <div class="patroc-sidebar-inner">
    <div class="patroc-sidebar-title">Patrocinadores &amp; Colaboradores</div>
    <div class="patroc-sidebar-body">
      <a href="https://www.castillalamancha.es/" target="_blank" rel="noopener" class="patroc-main">
        <div class="patroc-main-badge">Patrocinador Oficial</div>
        <img src="img/logo_castilla_la_mancha.png" alt="Junta de Castilla-La Mancha" onerror="this.outerHTML='<span style=\'font-size:12px;font-weight:700;color:var(--green-dark)\'>Junta CLM</span>'">
        <div class="patroc-main-name">Junta de Castilla-La Mancha</div>
      </a>
      <hr class="patroc-divider">
      <div class="patroc-divider-label">Colaboradores</div>
      <div class="patroc-logos-grid">
        <a href="https://automaor.com.es/" target="_blank" rel="noopener" class="patroc-logo-item" style="grid-column:1/-1;">
          <img src="https://www.fedgolfclm.com/wp-content/uploads/2025/04/Automaor-RENAULT-Golf-CLM-banners-05-1.jpg" alt="Automaor Renault" onerror="this.outerHTML='<span style=\'font-size:10px;font-weight:700\'>Automaor</span>'">
        </a>
        <a href="https://www.joma-sport.com/" target="_blank" rel="noopener" class="patroc-logo-item">
          <img src="http://www.fedgolfclm.com/wp-content/uploads/2021/09/joma-1.jpg" alt="Joma Sport" onerror="this.outerHTML='<span style=\'font-size:10px;font-weight:700\'>Joma</span>'">
        </a>
        <a href="http://www.rfegolf.es/" target="_blank" rel="noopener" class="patroc-logo-item">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Real_Federaci%C3%B3n_Espa%C3%B1ola_de_Golf_logo.svg/200px-Real_Federaci%C3%B3n_Espa%C3%B1ola_de_Golf_logo.svg.png" alt="RFEG" onerror="this.outerHTML='<span style=\'font-family:var(--font-display);font-weight:700;font-size:13px\'>RFEG</span>'">
        </a>
        <a href="http://www.fedgolfclm.com/acuerdo-suscrito-por-la-federacion-de-golf-de-castilla-la-mancha-con-golf-estudio/" target="_blank" rel="noopener" class="patroc-logo-item" style="grid-column:1/-1;">
          <img src="http://www.fedgolfclm.com/wp-content/uploads/2021/09/Golf-Estudio-1.jpg" alt="Golf Estudio" onerror="this.outerHTML='<span style=\'font-size:10px;font-weight:700\'>Golf Estudio</span>'">
        </a>
      </div>
    </div>
  </div>
</aside>

</div>

<script src="shared.js"></script>
<script>
(function() {
  'use strict';
  const PER_PAGE = 20;
  const CAT_GRADIENT = {
    'Masculino':'linear-gradient(135deg,#0a3d2e,#2d9e6b)',
    'Femenino':'linear-gradient(135deg,#3d0a1a,#9e2d5a)',
    'Masculino y Femenino':'linear-gradient(135deg,#0a2a3d,#2d7a9e)',
    'Senior':'linear-gradient(135deg,#3d2a0a,#9e7a2d)',
    'Juvenil':'linear-gradient(135deg,#1a3d0a,#5a9e2d)',
    'Profesional':'linear-gradient(135deg,#1a0a3d,#5a2d9e)',
    'Pitch & Putt':'linear-gradient(135deg,#2a1a0a,#7a5a2d)',
    'Federativas':'linear-gradient(135deg,#0a1a3d,#2d4a9e)',
    'Golf Adaptado':'linear-gradient(135deg,#0a3d3d,#2d9e9e)',
    'Reglas y Campos':'linear-gradient(135deg,#2a2a0a,#7a7a2d)',
    'default':'linear-gradient(135deg,#0a3d2e,#1a6645)'
  };

  let allData = [], filtered = [], currentPage = 1, selectedYear = '';

  const buscador    = document.getElementById('buscador');
  const filtroCat   = document.getElementById('filtroCat');
  const filtroAnyos = document.getElementById('filtroAnyos');
  const grid        = document.getElementById('noticiasGrid');
  const pagDiv      = document.getElementById('paginacion');
  const countEl     = document.getElementById('resultCount');
  const loadingEl   = document.getElementById('loadingState');
  const autocompleteDiv = document.getElementById('autocompleteResultados');

  function renderAutocomplete(q) {
    if (!q) {
      autocompleteDiv.style.display = 'none';
      return;
    }
    const qLower = q.toLowerCase();
    const matches = allData.filter(n => n.titulo.toLowerCase().includes(qLower)).slice(0, 8);

    if (matches.length === 0) {
      autocompleteDiv.style.display = 'none';
      return;
    }

    autocompleteDiv.innerHTML = matches.map(n => {
      const escapedQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escapedQ})`, 'gi');
      const highlightedTitle = n.titulo.replace(regex, '<strong>$1</strong>');
      return `<a href="noticia.html?id=${n.id}" class="autocomplete-item">${highlightedTitle}</a>`;
    }).join('');
    autocompleteDiv.style.display = 'flex';
  }

  function buildYearButtons(data) {
    const years = [...new Set(data.map(p => p.anyo))].filter(Boolean).sort((a,b) => b-a);
    filtroAnyos.innerHTML = '<option value="">Todos los años</option>';
    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      filtroAnyos.appendChild(opt);
    });
    filtroAnyos.value = selectedYear || '';
    filtroAnyos.addEventListener('change', () => {
      selectedYear = filtroAnyos.value;
      currentPage = 1;
      applyFilters();
    });
  }

  function setYear(year) {
    selectedYear = String(year);
    filtroAnyos.value = selectedYear;
    currentPage = 1;
    applyFilters();
  }

  function applyFilters() {
    const q   = buscador.value.trim().toLowerCase();
    const cat = filtroCat.value;
    filtered = allData.filter(n => {
      if (selectedYear && String(n.anyo) !== selectedYear) return false;
      if (cat && !n.categorias.includes(cat)) return false;
      if (q) {
        const hay = (n.titulo + ' ' + (n.excerpt||'') + ' ' + n.categorias.join(' ')).toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    currentPage = 1;
    render();
  }

  function getThumbBg(n) {
    return CAT_GRADIENT[n.categorias[0]||'default'] || CAT_GRADIENT.default;
  }
  function getThumb(n) {
    if (n.imagen) return `<img src="${n.imagen}" alt="" loading="lazy" onerror="this.style.display='none'">`;
    return `<img src="img/logo_pagina.png" class="img-fallback">`;
  }

  function renderCards(items) {
    if (!items.length) {
      grid.innerHTML = `<div class="empty-state"><strong>Sin resultados</strong>No hay noticias que coincidan con los filtros seleccionados.</div>`;
      return;
    }
    grid.innerHTML = items.map(n => {
      const cats = n.categorias.slice(0,2).join(' · ');
      return `
        <a href="noticia.html?id=${n.id}" class="noticia-fila">
          <div class="noticia-fila-thumb" style="background:${getThumbBg(n)};">${getThumb(n)}</div>
          <div class="noticia-fila-body">
            <div class="noticia-fila-meta">
              ${cats ? `<span class="noticia-cat">${cats}</span>` : ''}
              <span class="noticia-fecha">${n.fecha}</span>
            </div>
            <div class="noticia-fila-titulo">${n.titulo}</div>
            ${n.excerpt ? `<div class="noticia-fila-excerpt">${n.excerpt}</div>` : ''}
            <div class="noticia-fila-link">Leer noticia completa →</div>
          </div>
        </a>`;
    }).join('');
  }

  function renderPagination() {
    const pages = Math.ceil(filtered.length / PER_PAGE);
    if (pages <= 1) { pagDiv.innerHTML = ''; return; }
    let html = `<button class="pag-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Anterior</button>`;
    const delta = 2, start = Math.max(1, currentPage-delta), end = Math.min(pages, currentPage+delta);
    if (start > 1) { html += `<button class="pag-btn" onclick="goPage(1)">1</button>`; if (start>2) html += `<span style="padding:0 4px;color:var(--gray-300)">…</span>`; }
    for (let i=start; i<=end; i++) html += `<button class="pag-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    if (end < pages) { if (end<pages-1) html += `<span style="padding:0 4px;color:var(--gray-300)">…</span>`; html += `<button class="pag-btn" onclick="goPage(${pages})">${pages}</button>`; }
    html += `<button class="pag-btn" onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>Siguiente ›</button>`;
    pagDiv.innerHTML = html;
  }

  window.goPage = function(p) {
    const pages = Math.ceil(filtered.length / PER_PAGE);
    if (p < 1 || p > pages) return;
    currentPage = p;
    render();
    document.querySelector('.listado-section').scrollIntoView({ behavior:'smooth', block:'start' });
  };

  function render() {
    const total = filtered.length;
    const slice = filtered.slice((currentPage-1)*PER_PAGE, currentPage*PER_PAGE);
    countEl.textContent = total === allData.length
      ? `${total.toLocaleString('es')} noticias en total`
      : `${total.toLocaleString('es')} noticia${total!==1?'s':''} encontrada${total!==1?'s':''}`;
    renderCards(slice);
    renderPagination();
  }

  fetch('noticias_data.json')
    .then(r => { if(!r.ok) throw new Error('No se pudo cargar noticias_data.json'); return r.json(); })
    .then(data => {
      allData = data; filtered = [...allData];
      loadingEl.style.display = 'none';
      buildYearButtons(allData);
      render();
    })
    .catch(err => {
      loadingEl.style.display = 'none';
      grid.innerHTML = `<div class="empty-state"><strong>Error al cargar</strong>${err.message}</div>`;
      countEl.textContent = '';
    });

  let timer;
  buscador.addEventListener('input', () => { 
    clearTimeout(timer); 
    timer = setTimeout(applyFilters, 280); 
    renderAutocomplete(buscador.value.trim());
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.buscador-container')) {
      autocompleteDiv.style.display = 'none';
    }
  });

  buscador.addEventListener('focus', () => {
    if (buscador.value.trim()) {
      renderAutocomplete(buscador.value.trim());
    }
  });

  filtroCat.addEventListener('change', applyFilters);
})();
</script>
</body>
</html>
