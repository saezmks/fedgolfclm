<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XVII Campeonato de Castilla La Mancha Absoluto Masculino</title>
    <style>
        :root {
            --primary-green: #2C5E3B;
            --secondary-green: #4CAF50;
            --light-gray: #F4F7F6;
            --dark-gray: #333333;
            --white: #FFFFFF;
            --badge-color: #2980B9;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-gray);
            color: var(--dark-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .tournament-card {
            background-color: var(--white);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            border-top: 6px solid var(--primary-green);
            position: relative;
            transition: transform 0.3s ease;
        }
        .tournament-card:hover {
            transform: translateY(-5px);
        }
        .header-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
        }
        h1 {
            color: var(--primary-green);
            font-size: 28px;
            margin: 0;
            line-height: 1.3;
        }
        .badge {
            background-color: var(--badge-color);
            color: white;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 5px rgba(41, 128, 185, 0.4);
            white-space: nowrap;
        }
        .info-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .icon {
            margin-right: 12px;
            font-size: 24px;
        }
        .date {
            color: #666;
            font-weight: 500;
        }
        .location {
            margin: 0;
            color: var(--secondary-green);
            font-size: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="tournament-card">
        <div class="header-wrapper">
            <h1>XVII Campeonato de Castilla La Mancha Absoluto Masculino</h1>
            <span class="badge" title="World Amateur Golf Ranking">WAGR</span>
        </div>
        
        <div class="info-row date">
            <span class="icon">📅</span>
            <span>8 - 10 de mayo de 2026</span>
        </div>
        
        <div class="info-row">
            <span class="icon">📍</span>
            <h3 class="location">Layos</h3>
        </div>
    </div>
</body>
</html>
