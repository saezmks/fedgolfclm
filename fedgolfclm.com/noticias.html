<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticias — Federación de Golf de Castilla-La Mancha</title>
  <link rel="icon" type="image/png" href="img/favicon_pagina.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shared.css">
  <style>
    body { padding-top: 70px; }

    .noticias-archivo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5px;
      background: var(--gray-100);
      border: 1.5px solid var(--gray-100);
    }

    .noticia-fila {
      background: var(--white);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: all 0.25s;
      overflow: hidden;
    }

    .noticia-fila-thumb {
      aspect-ratio: 16/9;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .noticia-fila-body {
      padding: 20px 22px 24px;
      flex: 1; display: flex; flex-direction: column; gap: 8px;
    }

    .noticia-fila-meta {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }

    .noticia-cat {
      display: inline-block;
      padding: 3px 10px;
      background: var(--green-light);
      color: var(--green-mid);
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      border-radius: 2px;
    }

    .noticia-fecha { font-size: 11px; color: var(--gray-300); letter-spacing: 0.5px; }

    .noticia-fila-titulo {
      font-family: var(--font-display);
      font-size: 15px; font-weight: 700;
      line-height: 1.35; color: var(--green-dark);
      transition: color 0.2s;
    }

    .noticia-fila:hover .noticia-fila-titulo { color: var(--green-accent); }

    .noticia-fila-excerpt {
      font-size: 12px; color: var(--gray-600); line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .filtros-section {
      background: var(--gray-50);
      padding: 32px 6rem;
      border-bottom: 1px solid var(--gray-100);
    }

    .filtros-row {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    }

    .filtros-row input,
    .filtros-row select {
      padding: 10px 16px;
      border: 1.5px solid var(--gray-100);
      border-radius: 3px;
      font-family: var(--font-body);
      font-size: 13px; outline: none;
      color: var(--gray-900); background: var(--white);
      cursor: pointer; transition: border-color 0.2s;
    }

    .filtros-row input { min-width: 240px; flex: 1; }
    .filtros-row input:focus,
    .filtros-row select:focus { border-color: var(--green-accent); }

    .result-count {
      font-size: 12px; color: var(--gray-300); margin-bottom: 1.5rem;
    }

    @media (max-width: 900px) {
      .noticias-archivo-grid { grid-template-columns: 1fr 1fr; }
      .filtros-section { padding: 24px 2.5rem; }
    }
    @media (max-width: 600px) {
      .noticias-archivo-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="page-hero">
  <div class="page-hero-content">
    <div class="page-hero-label">Actualidad FGCLM</div>
    <h1>Archivo de <em>Noticias</em></h1>
    <p>Toda la actualidad del golf en Castilla-La Mancha: torneos, campeonatos y novedades de la federación.</p>
  </div>
</div>

<div class="filtros-section">
  <div class="filtros-row">
    <input type="text" id="buscador" placeholder="Buscar noticias...">
    <select id="filtroCat">
      <option value="todas">Todas las categorías</option>
      <option value="Masculino">Masculino</option>
      <option value="Femenino">Femenino</option>
      <option value="Senior">Senior</option>
      <option value="Juvenil">Juvenil</option>
      <option value="Profesional">Profesional</option>
      <option value="Pitch & Putt">Pitch &amp; Putt</option>
      <option value="Institucional">Institucional</option>
    </select>
    <select id="filtroAnyo">
      <option value="todos">Todos los años</option>
      <option value="2026">2026</option>
      <option value="2025">2025</option>
      <option value="2024">2024</option>
    </select>
  </div>
</div>

<section style="background:var(--white); padding-top:40px;">
  <div class="result-count" id="resultCount"></div>
  <div class="noticias-archivo-grid" id="noticiasGrid"></div>
</section>

<script src="shared.js"></script>
<script>
  const NOTICIAS = [
    { emoji:'⛳', bg:'linear-gradient(135deg,#0a3d2e,#2d9e6b)', cat:'Masculino y Femenino', fecha:'05 mayo 2026', anyo:'2026', titulo:'La Vereda vuelve a albergar el Campeonato de Castilla-La Mancha de Campos Cortos', excerpt:'Otro año más, el campo serrano del Club de Golf La Vereda organiza el Campeonato regional de Campos Cortos con gran participación.' },
    { emoji:'🏅', bg:'linear-gradient(135deg,#1a3a5c,#378add)', cat:'Masculino', fecha:'04 mayo 2026', anyo:'2026', titulo:'Listado definitivo del XVII Campeonato Absoluto Masculino de CLM 2026', excerpt:'Se celebra en el recorrido toledano de Layos entre el 8 y el 10 de mayo de 2026.' },
    { emoji:'🎖️', bg:'linear-gradient(135deg,#3d1a0a,#9e5a2d)', cat:'Senior', fecha:'04 mayo 2026', anyo:'2026', titulo:'Castilla-La Mancha representada en el Campeonato de España Senior Masculino', excerpt:'El recorrido sevillano de Pineda acoge la gran semana del golf senior masculino español.' },
    { emoji:'⛳', bg:'linear-gradient(135deg,#1a2a0a,#639922)', cat:'Profesional', fecha:'04 mayo 2026', anyo:'2026', titulo:'Gran cuarta plaza de José Manuel Pardo en el Circuito de Madrid de Profesionales', excerpt:'El recorrido de El Robledal ha acogido la cuarta prueba del Circuito bajo la modalidad Dobles.' },
    { emoji:'🏌️', bg:'linear-gradient(135deg,#2a1a3d,#7f77dd)', cat:'Pitch & Putt', fecha:'03 mayo 2026', anyo:'2026', titulo:'José María Pardo, puesto 37 en el II Puntuable Nacional de Pitch & Putt', excerpt:'Participación en la I Copa de Pitch & Putt de Castilla y León celebrada en Burgos.' },
    { emoji:'📋', bg:'linear-gradient(135deg,#0a3d2e,#1a6645)', cat:'Institucional', fecha:'28 abril 2026', anyo:'2026', titulo:'La FGCLM renueva el convenio de colaboración con la Junta de Castilla-La Mancha', excerpt:'El acuerdo garantiza el apoyo institucional al desarrollo del golf en la región hasta 2027.' },
    { emoji:'🏆', bg:'linear-gradient(135deg,#1a3d0a,#4a9e2d)', cat:'Femenino', fecha:'20 abril 2026', anyo:'2026', titulo:'Confirmado el calendario del Campeonato Autonómico Femenino 2026', excerpt:'La competición femenina más importante de la región tendrá lugar en mayo con las mejores jugadoras de CLM.' },
    { emoji:'🎓', bg:'linear-gradient(135deg,#0a1a3d,#2d5a9e)', cat:'Institucional', fecha:'10 abril 2026', anyo:'2026', titulo:'La Escuela FGCLM amplía su programa de iniciación para la temporada 2026', excerpt:'Nuevos horarios y modalidades de clase para atender la creciente demanda de inscripciones.' },
    { emoji:'⛳', bg:'linear-gradient(135deg,#2a3d0a,#7e9e2d)', cat:'Juvenil', fecha:'05 marzo 2026', anyo:'2026', titulo:'Arranca el Circuito Sub-18 CLM 2026 con récord de participación', excerpt:'La primera prueba del circuito juvenil se disputará en Las Pinaíllas con más de 80 jugadores inscritos.' },
    { emoji:'🏅', bg:'linear-gradient(135deg,#3d2a0a,#9e7a2d)', cat:'Senior', fecha:'20 febrero 2026', anyo:'2026', titulo:'Resultados del Campeonato de España Senior en Valladolid', excerpt:'Los representantes de Castilla-La Mancha obtienen destacados resultados en el campeonato nacional.' },
    { emoji:'📊', bg:'linear-gradient(135deg,#0a3d3d,#2d9e9e)', cat:'Institucional', fecha:'15 enero 2026', anyo:'2026', titulo:'Publicado el ranking inicial CLM de la temporada 2026', excerpt:'La federación ha publicado los rankings de inicio de temporada en todas las categorías.' },
    { emoji:'🏆', bg:'linear-gradient(135deg,#0a3d2e,#2d9e6b)', cat:'Masculino', fecha:'10 diciembre 2025', anyo:'2025', titulo:'Álvaro Pastor, campeón absoluto masculino CLM 2025', excerpt:'El jugador del Club de Golf Layos se proclamó campeón en una emocionante final en Torrijos.' },
    { emoji:'🎖️', bg:'linear-gradient(135deg,#3d0a2a,#9e2d7a)', cat:'Femenino', fecha:'05 diciembre 2025', anyo:'2025', titulo:'Ana Belén Martínez, nueva campeona absoluta femenina de CLM', excerpt:'La jugadora de Layos logra su segundo título regional consecutivo con una actuación impecable.' },
    { emoji:'📋', bg:'linear-gradient(135deg,#1a1a0a,#6b6b2d)', cat:'Institucional', fecha:'01 noviembre 2025', anyo:'2025', titulo:'Resumen de la temporada 2025: cifras récord en participación', excerpt:'La FGCLM cierra 2025 con más de 5.000 licencias expedidas y 82 torneos organizados.' },
  ];

  function renderNoticias() {
    const busqueda = document.getElementById('buscador').value.toLowerCase();
    const cat  = document.getElementById('filtroCat').value;
    const anyo = document.getElementById('filtroAnyo').value;

    const filtradas = NOTICIAS.filter(n => {
      const matchB = n.titulo.toLowerCase().includes(busqueda) || n.excerpt.toLowerCase().includes(busqueda);
      const matchC = cat  === 'todas' || n.cat.includes(cat);
      const matchA = anyo === 'todos' || n.anyo === anyo;
      return matchB && matchC && matchA;
    });

    const s = filtradas.length;
    document.getElementById('resultCount').textContent =
      `${s} noticia${s !== 1 ? 's' : ''} encontrada${s !== 1 ? 's' : ''}`;

    const grid = document.getElementById('noticiasGrid');
    grid.innerHTML = s === 0
      ? `<div style="padding:48px;text-align:center;color:var(--gray-300);font-size:14px;grid-column:1/-1;">No se encontraron noticias con esos filtros.</div>`
      : filtradas.map(n => `
        <a href="#" class="noticia-fila">
          <div class="noticia-fila-thumb" style="background:${n.bg};">
            <span style="font-size:36px;">${n.emoji}</span>
          </div>
          <div class="noticia-fila-body">
            <div class="noticia-fila-meta">
              <span class="noticia-cat">${n.cat}</span>
              <span class="noticia-fecha">${n.fecha}</span>
            </div>
            <div class="noticia-fila-titulo">${n.titulo}</div>
            <div class="noticia-fila-excerpt">${n.excerpt}</div>
          </div>
        </a>
      `).join('');
  }

  document.getElementById('buscador').addEventListener('input', renderNoticias);
  document.getElementById('filtroCat').addEventListener('change', renderNoticias);
  document.getElementById('filtroAnyo').addEventListener('change', renderNoticias);
  renderNoticias();
</script>
</body>
</html>
